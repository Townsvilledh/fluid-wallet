# Build integrity (audit P1): every push to main is rebuilt from source
# in CI, and the job FAILS if the committed dist/ differs from the fresh
# build — so the bundle users are served always corresponds to the
# published source. Tests run first; a red suite blocks nothing else
# here but is reported on the same job.
# One exclusion: dist/names.json is excluded from the compare because
# the name-claims processor updates the registry between releases by
# design — the registry is data the processor legitimately writes on
# its own commits (its integrity guard is the processor's signature
# verification, not this bundle check), so a names-only commit would
# otherwise leave the committed dist one registry-step stale and trip
# a false alarm (diagnosed live 2026-11-14, run 43629897435).
name: build-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rebuild from source and compare with committed dist/
        run: |
          npm run build
          if ! git diff --exit-code -- dist/ ':(exclude)dist/names.json'; then
            echo "::error::Committed dist/ does not match a fresh build from source. Run 'npm run build' locally and commit the result."
            exit 1
          fi
