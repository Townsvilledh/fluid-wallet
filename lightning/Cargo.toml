[package]
name = "fluid-lightning"
version = "0.1.0"
edition = "2021"
description = "Fluid's in-app Lightning node: rust-lightning (LDK) compiled to WASM, driven by JS host bridges. Pure self-custody — keys derive from the Fluid seed and never leave the user's device."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Official LDK / rust-bitcoin crates only (LightningDevKit / rust-bitcoin orgs).
# lightning is built WITHOUT its `std` feature: std::time traps on
# wasm32-unknown-unknown, so the node takes time from the chain tip and
# the host at construction, exactly like embedded no-std LDK targets.
lightning = { version = "=0.2.7", default-features = false, features = ["grind_signatures"] }
# LSPS client (LSPS1 channel orders + LSPS2 JIT channels) and, for
# server-role nodes, the LSPS2 service — the Lightning completion
# build's liquidity layer. Version-paired with lightning 0.2.7 (its
# manifest requires lightning ^0.2.0). Built no-std like the rest of
# the node: no `std`/`time` features; the node's own clock feeds it
# through a custom TimeProvider (see FluidTimeProvider in src/lib.rs).
lightning-liquidity = { version = "=0.2.7", default-features = false }
lightning-invoice = { version = "=0.34.1", default-features = false }
bitcoin = "=0.32.102"
wasm-bindgen = "=0.2.130"
lightning-types = "=0.3.5"
bitcoin-io = "=0.1.101"

[profile.release]
opt-level = "s"
strip = "symbols"
panic = "abort"
